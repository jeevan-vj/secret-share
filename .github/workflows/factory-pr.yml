name: Factory PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
      linked_issue: ${{ steps.issue.outputs.number }}
      factory_pr: ${{ steps.issue.outputs.factory_pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Resolve linked factory issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          number="$(printf '%s' "$PR_BODY" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels="$(gh issue view "$number" --json labels --jq '[.labels[].name] | join("\n")' 2>/dev/null || true)"
          if printf '%s\n' "$labels" | grep -Eq '^factory:(ready|delegated|review|needs-human)$'; then
            echo 'factory_pr=true' >> "$GITHUB_OUTPUT"
            gh issue edit "$number" --add-label 'factory:review' || true
          else
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Classify risk
        id: risk
        run: |
          risk='low'
          while IFS= read -r file; do
            case "$file" in
              src/lib/crypto.ts|src/lib/auth.ts|src/app/api/auth/*|src/app/api/auth/**|src/db/*|drizzle/*|SECURITY.md|docs/THREAT_MODEL.md|wrangler.jsonc|.github/*|.factory/*)
                risk='high'; break ;;
              src/app/api/*|src/services/*|src/lib/validation.ts|package.json|pnpm-lock.yaml)
                [ "$risk" = 'low' ] && risk='medium' ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

      - name: Report factory gate
        if: steps.issue.outputs.factory_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          RISK: ${{ steps.risk.outputs.risk }}
        run: |
          if [ "$RISK" = 'high' ] && [ "${{ vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE }}" != 'true' ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label 'factory:needs-human' || true
            gh pr comment "$PR_NUMBER" --body "Deterministic factory verification passed, but this PR is **high risk**. It will not auto-merge without human approval."
          else
            gh pr comment "$PR_NUMBER" --body "Deterministic factory verification passed. Risk: **$RISK**. Waiting for the independent native Codex code review before autonomous merge."
          fi
