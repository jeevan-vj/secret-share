name: Factory PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# This workflow is PR-controlled, so it must remain read-only. It verifies code
# only. All issue/PR writes and merge decisions live in factory-controller.yml,
# which is invoked via workflow_run from the trusted default branch.
permissions:
  contents: read

concurrency:
  group: factory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.draft == false
    name: Factory deterministic gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Classify risk for visibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          risk="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | node .factory/classify-risk.mjs)"
          echo "Factory risk classification: $risk"
