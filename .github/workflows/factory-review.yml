name: Factory Review Signal

on:
  pull_request_review:
    types: [submitted]

# This PR-associated workflow never writes. Its completion wakes the trusted
# default-branch factory-controller.yml via workflow_run.
permissions:
  contents: read

concurrency:
  group: factory-review-signal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signal:
    # Keep allowlist here so skipped non-factory reviews do not wake the controller
    # (workflow_run only proceeds on conclusion=success). Keep .factory/review-bots.json
    # as the controller's source of truth for live re-reads.
    if: >-
      github.event.review.user.type == 'Bot' &&
      (
        github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.review.user.login == 'cursor[bot]' ||
        github.event.review.user.login == 'cursor'
      )
    name: Factory review signal
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Record signal only
        env:
          REVIEW_LOGIN: ${{ github.event.review.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          echo "Factory review bot $REVIEW_LOGIN submitted a review for $REVIEW_COMMIT. Trusted controller will re-read the live PR state."
