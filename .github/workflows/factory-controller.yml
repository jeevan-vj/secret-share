name: Factory Trusted Controller

on:
  workflow_run:
    workflows:
      - Factory PR Gate
      - Factory Codex Review Signal
    types: [completed]
  pull_request_target:
    types: [closed]

# This workflow is security-sensitive and executes from the trusted default
# branch. PR-controlled workflows remain read-only and can only emit signals.
permissions:
  contents: read

concurrency:
  group: factory-controller-${{ github.event.workflow_run.head_branch || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    name: Evaluate factory merge gates
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control-plane code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .factory

      - name: Resolve PR and evaluate live gates
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PRS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          ALLOW_HIGH_RISK: ${{ vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE }}
        run: |
          set -euo pipefail

          pr_number="$(printf '%s' "$RUN_PRS_JSON" | jq -r '.[0].number // empty')"
          if [ -z "$pr_number" ] && [ -n "$HEAD_BRANCH" ]; then
            pr_number="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"
          fi
          [ -n "$pr_number" ] || { echo 'No open PR associated with this signal.'; exit 0; }

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          draft="$(printf '%s' "$pr_json" | jq -r '.draft')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')"
          pr_body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"

          [ "$state" = 'open' ] || exit 0
          [ "$draft" = 'false' ] || exit 0
          [ "$head_repo" = "$REPOSITORY" ] || { echo 'Fork PR: autonomous merge disabled.'; exit 0; }

          issue="$(printf '%s' "$pr_body" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          [ -n "$issue" ] || { echo 'No linked issue.'; exit 0; }

          issue_json="$(gh api "repos/$REPOSITORY/issues/$issue")"
          delegated="$(printf '%s' "$issue_json" | jq -r '[.labels[].name] | any(. == "factory:delegated")')"
          [ "$delegated" = 'true' ] || { echo 'Linked issue is not factory-delegated.'; exit 0; }

          # Require deterministic verification for the exact live head.
          check_conclusion="$(gh api "repos/$REPOSITORY/commits/$head_sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Factory deterministic gate" and .app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""')"
          [ "$check_conclusion" = 'success' ] || { echo "Deterministic gate is not green for $head_sha."; exit 0; }

          # Re-read every Codex review immediately before deciding. The latest
          # Codex review overall must target the current live head.
          reviews_file="$RUNNER_TEMP/reviews.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" > "$reviews_file"
          latest_review="$(jq -cs '[.[][] | select(.user.login == "chatgpt-codex-connector[bot]" and .user.type == "Bot")] | sort_by(.submitted_at) | last // {}' "$reviews_file")"
          review_id="$(printf '%s' "$latest_review" | jq -r '.id // empty')"
          review_head="$(printf '%s' "$latest_review" | jq -r '.commit_id // empty')"
          review_state="$(printf '%s' "$latest_review" | jq -r '.state // empty')"
          [ -n "$review_id" ] || { echo 'No native Codex review yet.'; exit 0; }
          [ "$review_head" = "$head_sha" ] || { echo 'Latest Codex review is stale; fresh review required.'; exit 0; }

          comments_file="$RUNNER_TEMP/review-comments.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/comments?per_page=100" > "$comments_file"
          inline_count="$(jq -csr --argjson review_id "$review_id" '[.[][] | select(.pull_request_review_id == $review_id)] | length' "$comments_file")"
          if [ "${review_state,,}" = 'changes_requested' ] || [ "$inline_count" -gt 0 ]; then
            gh issue edit "$issue" --add-label 'factory:needs-human' || true
            gh pr comment "$pr_number" --body $'Native Codex review contains blocking feedback. Use a **user-authored** `@codex address all current review findings` follow-up, then request a fresh review.'
            exit 0
          fi

          # Risk classification is deterministic and comes from trusted default-
          # branch policy, never from the candidate PR's policy definition.
          files_file="$RUNNER_TEMP/changed-files.txt"
          gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" --jq '.[].filename' > "$files_file"
          risk="$(node .factory/classify-risk.mjs < "$files_file")"

          if [ "$risk" = 'protected' ]; then
            gh issue edit "$issue" --add-label 'factory:needs-human' || true
            gh pr comment "$pr_number" --body 'This PR modifies the **factory/Codex control plane**. It is never auto-merged; human merge approval is required.'
            exit 0
          fi

          if [ "$risk" = 'high' ] && [ "$ALLOW_HIGH_RISK" != 'true' ]; then
            gh issue edit "$issue" --add-label 'factory:needs-human' || true
            gh pr comment "$pr_number" --body $'Deterministic CI and normal Codex review are clean, but this PR is **high risk**. Human merge approval is required. Before merging sensitive crypto/auth/secret-storage work, run a user-authored `@codex security review` and inspect the result.'
            exit 0
          fi

          # Re-read both the live head and latest Codex review immediately before
          # merge. This closes concurrent-push and concurrent-review races.
          final_head="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
          [ "$final_head" = "$head_sha" ] || { echo 'Head changed during evaluation; refusing merge.'; exit 0; }

          latest_now_file="$RUNNER_TEMP/reviews-final.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" > "$latest_now_file"
          latest_now_id="$(jq -csr '[.[][] | select(.user.login == "chatgpt-codex-connector[bot]" and .user.type == "Bot")] | sort_by(.submitted_at) | last | .id // empty' "$latest_now_file")"
          [ "$latest_now_id" = "$review_id" ] || { echo 'A newer Codex review arrived; refusing merge until reevaluated.'; exit 0; }

          gh issue edit "$issue" --add-label 'factory:review' || true
          gh pr comment "$pr_number" --body "Factory gates passed for \`$head_sha\`. Risk: **$risk**. Enabling squash auto-merge."
          gh pr merge "$pr_number" --auto --squash --delete-branch --match-head-commit "$head_sha"

  complete:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    name: Complete factory issue
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark linked delegated issue complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          issue="$(printf '%s' "$PR_BODY" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          [ -n "$issue" ] || exit 0
          issue_json="$(gh api "repos/$REPOSITORY/issues/$issue")"
          delegated="$(printf '%s' "$issue_json" | jq -r '[.labels[].name] | any(. == "factory:delegated")')"
          [ "$delegated" = 'true' ] || exit 0
          gh issue edit "$issue" --remove-label 'factory:review' --remove-label 'factory:needs-human' --add-label 'factory:complete' || true
