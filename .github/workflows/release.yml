name: Release to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to release
        required: false
        type: string
      production:
        description: Deploy production after staging
        required: true
        default: false
        type: boolean

concurrency:
  group: secret-share-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  staging:
    needs: verify
    if: vars.D1_STAGING_DATABASE_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_STAGING_DATABASE_ID }}
      WORKER_NAME: secret-share-staging
      DB_NAME: secret-share-staging
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Materialize staging Wrangler config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = process.env.WORKER_NAME;
          config.d1_databases[0].database_id = process.env.D1_ID;
          config.d1_databases[0].database_name = process.env.DB_NAME;
          config.vars = { ...(config.vars || {}), BETTER_AUTH_URL: process.env.BETTER_AUTH_URL || '' };
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
      - name: Apply staging D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote
      - name: Deploy staging Worker
        run: pnpm deploy
      - name: Set Better Auth secret
        if: env.BETTER_AUTH_SECRET != ''
        run: printf '%s' "$BETTER_AUTH_SECRET" | pnpm wrangler secret put BETTER_AUTH_SECRET --name "$WORKER_NAME"
      - name: Staging smoke test
        if: env.BETTER_AUTH_URL != ''
        run: curl --fail --silent --show-error --retry 4 --retry-all-errors "$BETTER_AUTH_URL/" >/dev/null

  production:
    needs: [verify, staging]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') &&
      vars.AUTONOMOUS_PRODUCTION == 'true' &&
      vars.D1_PRODUCTION_DATABASE_ID != '' &&
      (github.event_name == 'push' || inputs.production == true)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_PRODUCTION_DATABASE_ID }}
      WORKER_NAME: secret-share
      DB_NAME: secret-share-prod
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Materialize production Wrangler config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = process.env.WORKER_NAME;
          config.d1_databases[0].database_id = process.env.D1_ID;
          config.d1_databases[0].database_name = process.env.DB_NAME;
          config.vars = { ...(config.vars || {}), BETTER_AUTH_URL: process.env.BETTER_AUTH_URL || '' };
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
      - name: Apply production D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        run: pnpm deploy
      - name: Set Better Auth secret
        if: env.BETTER_AUTH_SECRET != ''
        run: printf '%s' "$BETTER_AUTH_SECRET" | pnpm wrangler secret put BETTER_AUTH_SECRET --name "$WORKER_NAME"
      - name: Production smoke test
        if: env.BETTER_AUTH_URL != ''
        run: curl --fail --silent --show-error --retry 4 --retry-all-errors "$BETTER_AUTH_URL/" >/dev/null
