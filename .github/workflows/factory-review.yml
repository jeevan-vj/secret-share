name: Factory Codex Review Gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    # Trust only the native ChatGPT/Codex GitHub App identity.
    if: github.event.review.user.login == 'chatgpt-codex-connector[bot]' && github.event.review.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve factory issue and review findings
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          issue="$(printf '%s' "$PR_BODY" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          if [ -z "$issue" ]; then
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_json="$(gh issue view "$issue" --json labels 2>/dev/null || true)"
          if [ -z "$issue_json" ]; then
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          delegated="$(printf '%s' "$issue_json" | jq -r '[.labels[].name] | any(. == "factory:delegated")')"
          if [ "$delegated" != 'true' ]; then
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'factory_pr=true' >> "$GITHUB_OUTPUT"

          # Bind review approval to both the event head and the PR's current live
          # head. A push after review submission must force a fresh review.
          live_head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          echo "live_head=$live_head" >> "$GITHUB_OUTPUT"
          if [ "$REVIEW_COMMIT" != "$EVENT_HEAD_SHA" ] || [ "$REVIEW_COMMIT" != "$live_head" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo 'blocking=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'stale=false' >> "$GITHUB_OUTPUT"

          # Fail closed: if GitHub cannot return all review comments, this step
          # fails and no write/merge step runs.
          inline_count="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" --jq "[.[] | select(.pull_request_review_id == $REVIEW_ID)] | length" | awk '{s+=$1} END {print s+0}')"
          if [ "${REVIEW_STATE,,}" = 'changes_requested' ] || [ "$inline_count" -gt 0 ]; then
            echo 'blocking=true' >> "$GITHUB_OUTPUT"
          else
            echo 'blocking=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Classify risk
        if: steps.review.outputs.factory_pr == 'true'
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          risk='low'
          while IFS= read -r file; do
            case "$file" in
              src/lib/crypto.ts|src/lib/auth.ts|src/lib/validation.ts|src/lib/security/*|src/lib/security/**|src/app/page.tsx|src/app/s/*|src/app/s/**|src/app/api/secrets/*|src/app/api/secrets/**|src/app/api/auth/*|src/app/api/auth/**|src/services/secrets.ts|src/db/*|src/db/**|drizzle/*|drizzle/**|SECURITY.md|docs/THREAT_MODEL.md|wrangler.jsonc|.github/*|.github/**|.factory/*|.factory/**)
                risk='high'; break ;;
              src/app/api/*|src/app/api/**|src/services/*|src/services/**|package.json|pnpm-lock.yaml)
                [ "$risk" = 'low' ] && risk='medium' ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

      - name: Check deterministic gate for this head
        if: steps.review.outputs.factory_pr == 'true' && steps.review.outputs.stale == 'false'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Factory deterministic gate" and .app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""')"
          if [ "$conclusion" = 'success' ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Escalate stale review
        if: steps.review.outputs.factory_pr == 'true' && steps.review.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body 'Ignoring this Codex review for merge purposes because it did not review the PR current head. A fresh Codex review is required.'

      - name: Escalate blocking review
        if: steps.review.outputs.factory_pr == 'true' && steps.review.outputs.stale == 'false' && steps.review.outputs.blocking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.review.outputs.issue }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label 'factory:needs-human' || true
          gh pr comment "$PR_NUMBER" --body $'Native Codex review found blocking feedback. Because subscription authentication belongs to your ChatGPT account, GitHub Actions does not impersonate that account to start the repair task. Add a **user-authored** comment such as `@codex address all current review findings, add regression tests, run pnpm test/typecheck/build, and update this PR`. A fresh Codex review of the updated head is required.'

      - name: Wait for deterministic verification
        if: steps.review.outputs.factory_pr == 'true' && steps.review.outputs.stale == 'false' && steps.review.outputs.blocking == 'false' && steps.ci.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body 'Native Codex review is clean, but the deterministic factory gate has not succeeded for this exact head SHA yet. The PR gate will retry the merge decision after tests/typecheck/build finish.'

      - name: Escalate high-risk merge
        if: >-
          steps.review.outputs.factory_pr == 'true' &&
          steps.review.outputs.stale == 'false' &&
          steps.review.outputs.blocking == 'false' &&
          steps.ci.outputs.passed == 'true' &&
          steps.risk.outputs.risk == 'high' &&
          vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.review.outputs.issue }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label 'factory:needs-human' || true
          gh pr comment "$PR_NUMBER" --body 'Native Codex review and deterministic CI are clean, but this PR is **high risk**. Human merge approval is required.'

      - name: Enable auto-merge for reviewed low/medium-risk factory PR
        if: >-
          steps.review.outputs.factory_pr == 'true' &&
          steps.review.outputs.stale == 'false' &&
          steps.review.outputs.blocking == 'false' &&
          steps.ci.outputs.passed == 'true' &&
          (steps.risk.outputs.risk != 'high' || vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_HEAD_SHA: ${{ github.event.review.commit_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Native Codex review is clean, deterministic verification passed for this exact head, and risk is **${{ steps.risk.outputs.risk }}**. Enabling squash auto-merge."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --match-head-commit "$REVIEWED_HEAD_SHA"
