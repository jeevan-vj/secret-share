name: Factory PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    name: Factory deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
      linked_issue: ${{ steps.issue.outputs.number }}
      factory_pr: ${{ steps.issue.outputs.factory_pr }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Resolve linked factory issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          number="$(printf '%s' "$PR_BODY" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_json="$(gh issue view "$number" --json labels 2>/dev/null || true)"
          if [ -z "$issue_json" ]; then
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          delegated="$(printf '%s' "$issue_json" | jq -r '[.labels[].name] | any(. == "factory:delegated")')"
          if [ "$delegated" = 'true' ]; then
            echo 'factory_pr=true' >> "$GITHUB_OUTPUT"
            gh issue edit "$number" --add-label 'factory:review' || true
          else
            echo 'factory_pr=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Classify risk
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          risk='low'
          while IFS= read -r file; do
            case "$file" in
              src/lib/crypto.ts|src/lib/auth.ts|src/app/api/auth/*|src/app/api/auth/**|src/db/*|drizzle/*|SECURITY.md|docs/THREAT_MODEL.md|wrangler.jsonc|.github/*|.factory/*)
                risk='high'; break ;;
              src/app/api/*|src/services/*|src/lib/validation.ts|package.json|pnpm-lock.yaml)
                [ "$risk" = 'low' ] && risk='medium' ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

      - name: Report factory gate
        if: steps.issue.outputs.factory_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          RISK: ${{ steps.risk.outputs.risk }}
          ALLOW_HIGH_RISK: ${{ vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE }}
        run: |
          if [ "$RISK" = 'high' ] && [ "$ALLOW_HIGH_RISK" != 'true' ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label 'factory:needs-human' || true
            gh pr comment "$PR_NUMBER" --body 'Deterministic factory verification passed, but this PR is **high risk**. It will not auto-merge without human approval.'
          else
            gh pr comment "$PR_NUMBER" --body "Deterministic factory verification passed. Risk: **$RISK**. Checking whether a clean native Codex review exists for this exact head."
          fi

      - name: Attempt merge after deterministic verification
        if: steps.issue.outputs.factory_pr == 'true' && (steps.risk.outputs.risk != 'high' || vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          review_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" --jq --arg sha "$HEAD_SHA" '[.[] | select(.user.login == "chatgpt-codex-connector[bot]" and .commit_id == $sha)] | sort_by(.submitted_at) | last // {}')"
          review_id="$(printf '%s' "$review_json" | jq -r '.id // empty')"
          review_state="$(printf '%s' "$review_json" | jq -r '.state // empty')"
          if [ -z "$review_id" ]; then
            echo 'No native Codex review exists for this head yet.'
            exit 0
          fi

          inline_count="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" --jq --argjson review_id "$review_id" '[.[] | select(.pull_request_review_id == $review_id)] | length' | awk '{s+=$1} END {print s+0}')"
          if [ "${review_state,,}" = 'changes_requested' ] || [ "$inline_count" -gt 0 ]; then
            echo 'Codex review contains findings; merge remains blocked.'
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --body "Deterministic verification and the native Codex review are both clean for head \`$HEAD_SHA\`. Enabling squash auto-merge."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  complete:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark linked delegated factory issue complete
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          number="$(printf '%s' "$PR_BODY" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          [ -n "$number" ] || exit 0
          labels="$(gh issue view "$number" --json labels --jq '[.labels[].name] | join("\n")' 2>/dev/null || true)"
          if printf '%s\n' "$labels" | grep -qx 'factory:delegated'; then
            gh issue edit "$number" --remove-label 'factory:review' --remove-label 'factory:needs-human' --add-label 'factory:complete' || true
          fi
