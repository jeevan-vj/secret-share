name: Factory PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# This workflow is PR-controlled, so it must remain read-only. It verifies code
# only. All issue/PR writes and merge decisions live in factory-controller.yml,
# which is invoked via workflow_run from the trusted default branch.
permissions:
  contents: read

concurrency:
  group: factory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.draft == false
    name: Factory deterministic gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Classify risk for visibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          risk='low'
          while IFS= read -r file; do
            case "$file" in
              src/lib/crypto.ts|src/lib/share-link.ts|src/lib/encoding.ts|src/lib/auth.ts|src/lib/validation.ts|src/lib/security/*|src/lib/security/**|src/app/page.tsx|src/app/s/*|src/app/s/**|src/app/api/secrets/*|src/app/api/secrets/**|src/app/api/auth/*|src/app/api/auth/**|src/services/secrets.ts|src/db/*|src/db/**|drizzle/*|drizzle/**|SECURITY.md|docs/THREAT_MODEL.md|wrangler.jsonc|.github/*|.github/**|.factory/*|.factory/**)
                risk='high'; break ;;
              src/app/api/*|src/app/api/**|src/services/*|src/services/**|package.json|pnpm-lock.yaml)
                [ "$risk" = 'low' ] && risk='medium' ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Factory risk classification: $risk"
