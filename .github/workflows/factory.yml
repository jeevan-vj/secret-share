name: Subscription-native Factory Intake

on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: factory-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  intake:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.action == 'reopened' && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'factory:ready') ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, '@codex'))
    runs-on: ubuntu-latest
    steps:
      - name: Ensure factory labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for spec in \
            'factory:ready|0E8A16|Ready for Codex Cloud factory' \
            'factory:delegated|1D76DB|Delegated to subscription-backed Codex Cloud' \
            'factory:review|8250DF|Factory PR awaiting or undergoing review' \
            'factory:needs-human|D93F0B|Factory needs human decision' \
            'factory:complete|2DA44E|Factory completed'; do
            IFS='|' read -r name color description <<< "$spec"
            gh label create "$name" --color "$color" --description "$description" --force >/dev/null
          done

      - name: Validate subscription-backed Codex handoff
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'issue_comment' ]; then
            handoff="$COMMENT_BODY"
          else
            handoff="$ISSUE_BODY"
          fi

          if printf '%s' "$handoff" | grep -qi '@codex'; then
            echo 'delegated=true' >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --remove-label 'factory:needs-human' --add-label 'factory:delegated' || true
          else
            echo 'delegated=false' >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --add-label 'factory:needs-human' || true
            gh issue comment "$ISSUE_NUMBER" --body $'This factory uses your ChatGPT/Codex subscription through the native GitHub integration, not an API key.\n\nTo delegate this issue, add a **user-authored** comment beginning with `@codex` and ask Codex to plan, implement with TDD, run verification, and create a PR that closes this issue. New issues created from the **Factory task** template include this handoff automatically.'
          fi

      - name: Record delegation mode
        if: steps.gate.outputs.delegated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'Factory intake accepted. This user-authored `@codex` handoff uses your ChatGPT/Codex subscription. PR-controlled workflows remain read-only; the trusted default-branch controller handles deterministic gating and eligible merges.'
