name: Bootstrap pnpm lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lockfile:
    if: >-
      github.event.pull_request.head.ref == 'feat/subscription-native-factory' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Assert lockfile is the only workspace change
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | grep -vE '^\?\? pnpm-lock\.yaml$|^ M pnpm-lock\.yaml$|^M  pnpm-lock\.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit lockfile only
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: add deterministic pnpm lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
